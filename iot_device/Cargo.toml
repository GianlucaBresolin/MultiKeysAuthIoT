[package]
name = "iot_device"
version = "0.1.0"
edition = "2024"
 
[dependencies]
heapless = { version = "0.9.3", default-features = false }
aes = { version = "0.9.3", default-features = false }
cipher = { version = "0.5.2", default-features = false, features = ["block-padding"] }
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
virtio-drivers = "0.13"
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "socket-udp", "proto-ipv4"] }
 
[profile.dev]
panic = "abort"
 
[profile.release]
panic = "abort"